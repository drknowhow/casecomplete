[package]
name = "cc-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Named `overlay_demo` so that building several crates' examples in one cargo
# invocation does not collide with cc-window's `demo` example.
[[example]]
name = "overlay_demo"
path = "examples/demo.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
# Foundation_Numerics gates ID2D1RenderTarget::CreateSolidColorBrush in windows 0.58.
windows = { workspace = true, features = ["Foundation_Numerics"] }
crossbeam-channel.workspace = true
parking_lot.workspace = true
