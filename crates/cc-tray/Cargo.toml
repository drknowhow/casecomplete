[package]
name = "cc-tray"
version.workspace = true
edition.workspace = true
license.workspace = true

# Named `tray_demo` (not `demo`) so that building several crates' examples in
# one cargo invocation does not collide with cc-window's `demo` example.
[[example]]
name = "tray_demo"
path = "examples/demo.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
tray-icon = "0.26.1"
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
