[package]
name = "cc-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "casecomplete"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
tokio-util.workspace = true
crossbeam-channel.workspace = true
cc-hook = { path = "../cc-hook" }
cc-context = { path = "../cc-context" }
cc-engine = { path = "../cc-engine" }
cc-overlay = { path = "../cc-overlay" }
cc-inject = { path = "../cc-inject" }
cc-correct = { path = "../cc-correct" }
cc-store = { path = "../cc-store" }
cc-tray = { path = "../cc-tray" }
cc-ui = { path = "../cc-ui" }
cc-window = { path = "../cc-window" }
winreg = "0.55"
windows = { workspace = true, features = ["Win32_System_Console"] }
serde.workspace = true
serde_json.workspace = true
